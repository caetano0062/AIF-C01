            const [examFinished, setExamFinished] = useState(false);
            const [domainFilter, setDomainFilter] = useState("Todos");
            const [examMode, setExamMode] = useState(false); // Modo Prática (explicação instantânea) vs Modo Exame (timer)
            const [timeLeft, setTimeLeft] = useState(90 * 60); // 90 minutos em segundos
            const [timerActive, setTimerActive] = useState(false);

            // Timer Effect
            useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0 && !examFinished) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && timerActive) {
                    finishExam();
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft, examFinished]);

            // Formatação do tempo
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // Filtragem de perguntas por domínio
            const filteredQuestions = useMemo(() => {
                if (domainFilter === "Todos") return questionsData;
                if (domainFilter === "FocusAmazonQ") return questionsData.filter(q => q.question.includes("Amazon Q") || q.subtopic.includes("Amazon Q") || q.question.includes("VPC") || q.question.includes("Rede"));
                return questionsData.filter(q => q.domain.startsWith(domainFilter));
            }, [domainFilter]);

            // Garantir que o índice atual seja válido dentro da lista filtrada
            const currentQuestion = filteredQuestions[currentIdx] || filteredQuestions[0];
            const realQuestionIndex = questionsData.findIndex(q => q.id === currentQuestion.id);

            // Handlers
            const handleSelectOption = (optionId) => {
                if (examFinished) return;
                const newAnswers = [...answers];
                newAnswers[realQuestionIndex] = optionId;
                setAnswers(newAnswers);
            };

            const toggleFlag = (idx) => {
                const newFlags = [...flagged];
                newFlags[idx] = !newFlags[idx];
                setFlagged(newFlags);
            };

            const toggleExplanation = (idx) => {
                const newExplanations = [...showExplanation];
                newExplanations[idx] = !newExplanations[idx];
                setShowExplanation(newExplanations);
            };

            const startTimedExam = () => {
                setExamMode(true);
                setTimerActive(true);
                setTimeLeft(90 * 60);
            };

            const finishExam = () => {
                setTimerActive(false);
                setExamFinished(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const resetExam = () => {
                setAnswers(Array(questionsData.length).fill(null));
                setFlagged(Array(questionsData.length).fill(false));
                setShowExplanation(Array(questionsData.length).fill(false));
                setExamFinished(false);
                setCurrentIdx(0);
                setTimerActive(false);
                setTimeLeft(90 * 60);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Cálculo da Pontuação
            const scoreDetails = useMemo(() => {
                let correctCount = 0;
                const domainStats = {};

                questionsData.forEach((q, idx) => {
                    const isCorrect = answers[idx] === q.correctOption;
                    if (isCorrect) correctCount++;

                    if (!domainStats[q.domain]) {
                        domainStats[q.domain] = { total: 0, correct: 0 };
                    }
                    domainStats[q.domain].total++;
                    if (isCorrect) domainStats[q.domain].correct++;
                });

                const percentage = Math.round((correctCount / questionsData.length) * 100);
                // Escala AWS de 100 a 1000
                const awsScaledScore = Math.round(100 + (correctCount / questionsData.length) * 900);
                const passed = awsScaledScore >= 700;

                return { correctCount, percentage, awsScaledScore, passed, domainStats };
            }, [answers]);

            if (examFinished) {
                return (
                    <div className="max-w-5xl mx-auto my-8 p-4 sm:p-8">
                        <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                            {/* Header de Resultado */}
                            <div className={`p-8 text-center text-white ${scoreDetails.passed ? 'bg-gradient-to-r from-emerald-600 to-teal-700' : 'bg-gradient-to-r from-rose-600 to-red-700'}`}>
                                <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white/20 mb-4 backdrop-blur-sm">
                                    <i className={`fas ${scoreDetails.passed ? 'fa-check-circle text-emerald-200' : 'fa-times-circle text-rose-200'} text-5xl`}></i>
                                </div>
                                <h1 className="text-3xl sm:text-4xl font-extrabold mb-2">
                                    {scoreDetails.passed ? 'APROVADO NO SIMULADO!' : 'PRECISA MELHORAR'}
                                </h1>
                                <p className="text-lg opacity-90">
                                    Pontuação AWS AIF-C01 Escalonada: <span className="font-bold text-2xl">{scoreDetails.awsScaledScore}</span> / 1000
                                </p>
                                <p className="text-sm opacity-80 mt-1">
                                    (Nota mínima para aprovação oficial no exame: 700 pontos)
                                </p>
                            </div>

                            {/* Resumo de Metricas */}
                            <div className="p-6 sm:p-8 border-b border-slate-100 bg-slate-50">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <span className="text-slate-500 text-xs font-semibold uppercase block">Acertos Totais</span>
                                        <span className="text-3xl font-extrabold text-slate-800">{scoreDetails.correctCount} / {questionsData.length}</span>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <span className="text-slate-500 text-xs font-semibold uppercase block">Porcentagem</span>
                                        <span className="text-3xl font-extrabold text-slate-800">{scoreDetails.percentage}%</span>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <span className="text-slate-500 text-xs font-semibold uppercase block">Status</span>
                                        <span className={`text-xl font-bold ${scoreDetails.passed ? 'text-emerald-600' : 'text-rose-600'}`}>
                                            {scoreDetails.passed ? 'Pronto para a Prova' : 'Revisão Necessária'}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Detalhamento por Domínio */}
                            <div className="p-6 sm:p-8">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                    <i className="fas fa-chart-pie text-orange-500 mr-2"></i> Desempenho por Domínio da Prova
                                </h3>
                                <div className="space-y-4">
                                    {Object.entries(scoreDetails.domainStats).map(([domain, stat]) => {
                                        const pct = Math.round((stat.correct / stat.total) * 100);
                                        const domainPassed = pct >= 70;
                                        return (
                                            <div key={domain} className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-semibold text-slate-700 text-sm">{domain}</span>
                                                    <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${domainPassed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                        {stat.correct}/{stat.total} ({pct}%)
                                                    </span>
                                                </div>
                                                <div className="w-full bg-slate-200 rounded-full h-2">
                                                    <div className={`h-2 rounded-full ${domainPassed ? 'bg-emerald-500' : 'bg-rose-500'}`} style={{ width: `${pct}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-8 flex flex-wrap gap-4 justify-center">
                                    <button 
                                        onClick={resetExam}
                                        className="bg-orange-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-600 transition shadow-lg flex items-center"
                                    >
                                        <i className="fas fa-redo mr-2"></i> Reiniciar Simulado
                                    </button>
                                </div>
                            </div>

                            {/* Revisão de Todas as Respostas */}
                            <div className="p-6 sm:p-8 bg-slate-50 border-t border-slate-200">
                                <h3 className="text-xl font-bold text-slate-800 mb-6">Revisão Detalhada das Questões</h3>
                                <div className="space-y-6">
                                    {questionsData.map((q, idx) => {
                                        const userAnswer = answers[idx];
                                        const isCorrect = userAnswer === q.correctOption;
                                        return (
                                            <div key={q.id} className={`p-6 bg-white rounded-xl border-l-4 shadow-sm ${isCorrect ? 'border-emerald-500' : 'border-rose-500'}`}>
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-xs font-bold text-slate-400">Questão {q.id} de {questionsData.length}</span>
                                                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                        {isCorrect ? 'ACERTOU' : 'ERROU'}
                                                    </span>
                                                </div>
                                                <p className="font-semibold text-slate-800 mb-4">{q.question}</p>
                                                
                                                <div className="space-y-2 mb-4">
                                                    {q.options.map(opt => {
                                                        let optClass = "p-3 rounded-lg border text-sm flex items-center ";
                                                        if (opt.id === q.correctOption) {
                                                            optClass += "bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold";
                                                        } else if (opt.id === userAnswer && !isCorrect) {
                                                            optClass += "bg-rose-50 border-rose-300 text-rose-900 font-semibold";
                                                        } else {
                                                            optClass += "bg-slate-50 border-slate-200 text-slate-600";
                                                        }
                                                        return (
                                                            <div key={opt.id} className={optClass}>
                                                                <span className="w-6 font-bold mr-2">{opt.id})</span>
                                                                <span>{opt.text}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <div className="p-4 bg-slate-100 rounded-lg text-sm text-slate-700">
                                                    <strong className="text-slate-900 block mb-1">Explicação Oficial:</strong>
                                                    {q.explanation}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Top Header Bar */}
                    <header className="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="bg-orange-500 text-white p-2 rounded-lg font-bold text-xl leading-none">
                                    AWS
                                </div>
                                <div>
                                    <h1 className="text-base font-bold leading-tight">Simulado Oficial AIF-C01</h1>
                                    <p className="text-xs text-slate-400">AWS Certified AI Practitioner - 65 Questoes</p>
                                </div>
                            </div>

                            {/* Controles do Header */}
                            <div className="flex items-center space-x-4">
                                {examMode && (
                                    <div className="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400 font-mono text-sm">
                                        <i className="fas fa-clock"></i>
                                        <span>{formatTime(timeLeft)}</span>
                                    </div>
                                )}

                                <button 
                                    onClick={finishExam}
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold transition shadow"
                                >
                                    Finalizar e Ver Nota
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Sub-Header de Filtros e Progresso */}
                    <div className="bg-white border-b border-slate-200 px-4 py-3">
                        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4 text-sm">
                            {/* Filtro por Domínio */}
                            <div className="flex items-center space-x-2 overflow-x-auto custom-scrollbar pb-1 sm:pb-0">
                                <span className="text-slate-500 text-xs font-bold uppercase whitespace-nowrap">Filtrar:</span>
                                <button 
                                    onClick={() => { setDomainFilter("Todos"); setCurrentIdx(0); }}
                                    className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${domainFilter === "Todos" ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    Todos (65)
                                </button>
                                <button 
                                    onClick={() => { setDomainFilter("FocusAmazonQ"); setCurrentIdx(0); }}
                                    className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${domainFilter === "FocusAmazonQ" ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}`}
                                >
                                    <i className="fas fa-bullseye mr-1"></i> Foco: Amazon Q & VPC Redes
                                </button>
                                <button 
                                    onClick={() => { setDomainFilter("Domínio 3"); setCurrentIdx(0); }}
                                    className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${domainFilter === "Domínio 3" ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    Domínio 3 (28%)
                                </button>
                                <button 
                                    onClick={() => { setDomainFilter("Domínio 5"); setCurrentIdx(0); }}
                                    className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${domainFilter === "Domínio 5" ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    Domínio 5 (14%)
                                </button>
                            </div>

                            {/* Contador de Respondidas */}
                            <div className="text-xs font-semibold text-slate-500">
                                Respondidas: <span className="text-slate-900 font-bold">{answers.filter(a => a !== null).length}</span> de 65
                            </div>
                        </div>
                    </div>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
                        
                        {/* Coluna Esquerda: Cartão da Pergunta (3 colunas em tela grande) */}
                        <div className="lg:col-span-3 space-y-6">
                            
                            {/* Barra de Progresso Superior */}
                            <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                <div 
                                    className="bg-orange-500 h-2 transition-all duration-300"
                                    style={{ width: `${((currentIdx + 1) / filteredQuestions.length) * 100}%` }}
                                ></div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                                {/* Header da Questão */}
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-4 pb-4 border-b border-slate-100">
                                    <div className="flex items-center space-x-2">
                                        <span className="bg-slate-900 text-white text-xs px-3 py-1 rounded-full font-bold">
                                            Questão {currentIdx + 1} de {filteredQuestions.length}
                                        </span>
                                        <span className="bg-orange-100 text-orange-800 text-xs px-3 py-1 rounded-full font-semibold">
                                            {currentQuestion.domain}
                                        </span>
                                    </div>

                                    <button 
                                        onClick={() => toggleFlag(realQuestionIndex)}
                                        className={`text-xs font-semibold px-3 py-1.5 rounded-lg border transition flex items-center ${flagged[realQuestionIndex] ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                    >
                                        <i className={`fas fa-flag mr-1.5 ${flagged[realQuestionIndex] ? 'text-amber-600' : ''}`}></i>
                                        {flagged[realQuestionIndex] ? 'Marcada para Revisar' : 'Marcar para Revisar'}
                                    </button>
                                </div>

                                {/* Texto da Questão */}
                                <h2 className="text-lg sm:text-xl font-semibold text-slate-800 mb-6 leading-relaxed">
                                    {currentQuestion.question}
                                </h2>

                                {/* Opções de Resposta */}
                                <div className="space-y-3 mb-8">
                                    {currentQuestion.options.map((opt) => {
                                        const isSelected = answers[realQuestionIndex] === opt.id;
                                        const isRevealed = showExplanation[realQuestionIndex];
                                        const isCorrectOpt = opt.id === currentQuestion.correctOption;

                                        let styleClass = "option-hover p-4 border rounded-xl cursor-pointer transition flex items-start ";
                                        if (isRevealed) {
                                            if (isCorrectOpt) styleClass += "correct-option";
                                            else if (isSelected) styleClass += "incorrect-option";
                                            else styleClass += "border-slate-200 opacity-60";
                                        } else if (isSelected) {
                                            styleClass += "selected-option";
                                        } else {
                                            styleClass += "border-slate-200 bg-white";
                                        }

                                        return (
                                            <div 
                                                key={opt.id}
                                                onClick={() => handleSelectOption(opt.id)}
                                                className={styleClass}
                                            >
                                                <div className={`w-7 h-7 rounded-lg border flex items-center justify-center mr-3 mt-0.5 text-sm font-bold shrink-0 transition ${isSelected ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 text-slate-500 bg-slate-50'}`}>
                                                    {opt.id}
                                                </div>
                                                <p className="text-slate-700 text-sm sm:text-base leading-snug pt-0.5">{opt.text}</p>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Caixa de Explicação (Disponível no Modo Prática / Revelar) */}
                                {showExplanation[realQuestionIndex] && (
                                    <div className="p-5 bg-slate-50 border-l-4 border-blue-600 rounded-r-xl mb-8 text-sm">
                                        <h4 className="font-bold text-blue-900 mb-2 flex items-center">
                                            <i className="fas fa-info-circle mr-2"></i> Explicação Detalhada de Arquitetura:
                                        </h4>
                                        <p className="text-slate-700 leading-relaxed italic">
                                            {currentQuestion.explanation}
                                        </p>
                                    </div>
                                )}

                                {/* Botões de Navegação */}
                                <div className="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100">
                                    <button 
                                        onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                                        disabled={currentIdx === 0}
                                        className="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-semibold hover:bg-slate-50 disabled:opacity-40 text-sm flex items-center"
                                    >
                                        <i className="fas fa-chevron-left mr-2"></i> Anterior
                                    </button>

                                    <button 
                                        onClick={() => toggleExplanation(realQuestionIndex)}
                                        className="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition"
                                    >
                                        {showExplanation[realQuestionIndex] ? 'Ocultar Explicação' : 'Ver Explicação'}
                                    </button>

                                    <button 
                                        onClick={() => setCurrentIdx(prev => Math.min(filteredQuestions.length - 1, prev + 1))}
                                        disabled={currentIdx === filteredQuestions.length - 1}
                                        className="px-6 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold disabled:opacity-40 text-sm transition flex items-center"
                                    >
                                        Próxima <i className="fas fa-chevron-right ml-2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Coluna Direita: Matriz de Questões / Paleta de Navegação Rápida */}
                        <div className="lg:col-span-1 space-y-4">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-20">
                                <h3 className="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
                                    <span>Navegador de Questões</span>
                                    <span className="text-xs text-slate-400 font-normal">{filteredQuestions.length} itens</span>
                                </h3>

                                <div className="grid grid-cols-5 gap-2 max-h-96 overflow-y-auto custom-scrollbar p-1">
                                    {filteredQuestions.map((q, idx) => {
                                        const origIdx = questionsData.findIndex(item => item.id === q.id);
                                        const isAnswered = answers[origIdx] !== null;
                                        const isFlagged = flagged[origIdx];
                                        const isCurrent = idx === currentIdx;

                                        let btnClass = "h-9 w-full rounded-lg font-bold text-xs flex items-center justify-center transition border relative ";
                                        if (isCurrent) {
                                            btnClass += "ring-2 ring-orange-500 ring-offset-1 font-extrabold ";
                                        }
                                        
                                        if (isAnswered) {
                                            btnClass += "bg-blue-600 border-blue-600 text-white";
                                        } else {
                                            btnClass += "bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100";
                                        }

                                        return (
                                            <button 
                                                key={q.id}
                                                onClick={() => setCurrentIdx(idx)}
                                                className={btnClass}
                                            >
                                                {q.id}
                                                {isFlagged && (
                                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 border border-white rounded-full"></span>
                                                )}
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Legenda */}
                                <div className="mt-4 pt-4 border-t border-slate-100 space-y-2 text-xs text-slate-500">
                                    <div className="flex items-center">
                                        <span className="w-3 h-3 bg-blue-600 rounded mr-2"></span>
                                        <span>Respondida</span>
                                    </div>
                                    <div className="flex items-center">
                                        <span className="w-3 h-3 bg-slate-100 border border-slate-300 rounded mr-2"></span>
                                        <span>Não respondida</span>
                                    </div>
                                    <div className="flex items-center">
                                        <span className="w-2.5 h-2.5 bg-amber-400 rounded-full mr-2"></span>
                                        <span>Marcada para revisar</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
